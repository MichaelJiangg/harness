[project]
name = "michael-harness"
version = "1.0"
description = "A Python query engine with DeepSeek/GLM and a local tool system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.0"]
authors = [{ name = "Michael Jiang" }]
keywords = ["ai", "agent", "cli", "deepseek", "glm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
]

[project.scripts]
harness = "harness.__main__:main"

[project.urls]
Repository = "https://github.com/MichaelJiangg/harness"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
